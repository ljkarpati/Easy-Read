<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>EasyRead</title>
  <script>
    // Unknown address: go to the app's home. The site lives in a subfolder
    // on GitHub Pages (/repo-name/), so keep the first part of the path.
    var parts = location.pathname.split("/");
    location.replace(parts.length > 2 ? "/" + parts[1] + "/" : "./");
  </script>
</head>
<body style="background:#FBF5E9"></body>
</html>
