<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyRead icon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #FBF5E9; color: #2B2620; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { margin: 0 0 24px; font-size: 34px; letter-spacing: -0.02em; }
    .master { display: block; width: 100%; max-width: 1024px; height: auto; border-radius: 12px; }
    .sizes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
    .stage { display: flex; align-items: flex-end; gap: 20px; padding: 20px; border-radius: 12px; }
    .light { background: #F2F2F7; }
    .dark { background: #1C1C1E; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 6px; font-size: 12px; color: #6E6E73; }
    .dark figcaption { color: #AEAEB2; }
    .ios { display: block; border-radius: 22.37%; }
  </style>
</head>
<body>
  <main>
    <h1>EasyRead icon</h1>
    <img class="master" src="icon.svg" width="1024" height="1024" alt="The EasyRead icon at 1024 pixels">
    <div class="sizes">
      <div class="stage light">
        <figure><img class="ios" src="icon.svg" width="180" height="180" alt=""><figcaption>180</figcaption></figure>
        <figure><img class="ios" src="icon.svg" width="60" height="60" alt=""><figcaption>60</figcaption></figure>
        <figure><img src="favicon.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      </div>
      <div class="stage dark">
        <figure><img class="ios" src="icon.svg" width="180" height="180" alt=""><figcaption>180</figcaption></figure>
        <figure><img class="ios" src="icon.svg" width="60" height="60" alt=""><figcaption>60</figcaption></figure>
        <figure><img src="favicon.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      </div>
    </div>
  </main>
</body>
</html>
