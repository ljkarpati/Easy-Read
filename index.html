<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF5E9">
  <title>EasyRead</title>
  <meta name="description" content="Makes reading more comfortable. Free, private, works offline.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="EasyRead">
  <meta property="og:description" content="Makes reading more comfortable. Free, private, works offline.">
  <meta property="og:url" content="https://ljkarpati.github.io/Easy-Read/">
  <meta property="og:image" content="https://ljkarpati.github.io/Easy-Read/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The EasyRead icon and name on a cream background">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EasyRead">
  <meta name="twitter:description" content="Makes reading more comfortable. Free, private, works offline.">
  <meta name="twitter:image" content="https://ljkarpati.github.io/Easy-Read/og-image.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EasyRead">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/opendyslexic-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Apply the saved theme before the first paint so there is no flash.
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem("easyread.settings") || "{}") || {}; } catch (e) {}
      var t = s.theme;
      if (["paper", "sky", "dusk", "night"].indexOf(t) < 0) {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dusk" : "paper";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <!-- Icons from Lucide (ISC license, lucide.dev) -->
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M11 14h10"/><path d="M16 4h2a2 2 0 0 1 2 2v1.344"/><path d="m17 18 4-4-4-4"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 1.793-1.113"/><rect x="8" y="2" width="8" height="4" rx="1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></symbol>
    <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></symbol>
    <symbol id="i-skip-forward" viewBox="0 0 24 24"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="12" cy="9" r="1"/><circle cx="19" cy="9" r="1"/><circle cx="5" cy="9" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="19" cy="15" r="1"/><circle cx="5" cy="15" r="1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
  </svg>

  <div class="app" id="app">
    <section class="view library" id="library" aria-label="Library">
      <header class="library-head">
        <h1 class="large-title">EasyRead</h1>
        <button class="icon-btn" type="button" id="new-btn" aria-label="New text" aria-haspopup="dialog"><svg class="icon"><use href="#i-plus"/></svg></button>
      </header>
      <ul class="doc-list" id="doc-list"></ul>
      <div class="empty" id="empty" hidden>
        <p>Paste something to read.</p>
        <button class="big-btn" type="button" id="empty-paste"><svg class="icon"><use href="#i-paste"/></svg>Paste</button>
      </div>
      <p class="library-foot">Your text stays on this device.</p>
    </section>

    <section class="view reader" id="reader" aria-label="Reader" hidden>
      <header class="topbar" id="topbar">
        <button class="icon-btn back" type="button" id="back-btn" aria-label="Library"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
        <p class="topbar-title" id="bar-title" aria-hidden="true"></p>
        <button class="aa-btn" type="button" id="aa-btn" aria-label="Text and voice" aria-haspopup="dialog" aria-expanded="false">Aa</button>
      </header>

      <div class="reader-scroll" id="scroller">
        <article class="page" id="page"></article>
      </div>

      <div class="ruler" id="ruler" hidden>
        <div class="ruler-mask top"></div>
        <div class="ruler-mask bottom"></div>
        <div class="ruler-handle" id="ruler-handle" aria-hidden="true"><svg class="icon"><use href="#i-grip"/></svg></div>
      </div>

      <button class="chip" type="button" id="back-chip" hidden>Back to reading</button>

      <div class="player-area">
        <div class="player" id="player" role="group" aria-label="Read aloud">
          <button class="player-btn" type="button" id="prev-btn" aria-label="Previous sentence"><svg class="icon filled"><use href="#i-skip-back"/></svg></button>
          <button class="player-btn play" type="button" id="play-btn" aria-label="Play"><svg class="icon filled"><use href="#i-play"/></svg></button>
          <button class="player-btn" type="button" id="next-btn" aria-label="Next sentence"><svg class="icon filled"><use href="#i-skip-forward"/></svg></button>
          <button class="speed-btn" type="button" id="speed-btn" aria-label="Speed 1 times">1×</button>
        </div>
        <div class="no-voice" id="no-voice" hidden>
          <p>For read-aloud, open in Safari or Chrome.</p>
          <button class="pill-btn small" type="button" id="copy-link"><svg class="icon"><use href="#i-copy"/></svg>Copy link</button>
        </div>
      </div>
    </section>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>

  <section class="sheet new-sheet" id="new-sheet" role="dialog" aria-modal="true" aria-label="New text" hidden>
    <header class="sheet-bar">
      <button class="bar-btn" type="button" id="new-cancel">Cancel</button>
      <button class="bar-btn strong" type="button" id="new-read" disabled>Read</button>
    </header>
    <label for="new-text" class="visually-hidden">Text to read</label>
    <textarea id="new-text" placeholder="Paste or type text" spellcheck="true" autocapitalize="sentences"></textarea>
    <div class="new-actions">
      <button class="pill-btn" type="button" id="new-paste"><svg class="icon"><use href="#i-paste"/></svg>Paste</button>
      <button class="pill-btn" type="button" id="new-open"><svg class="icon"><use href="#i-file"/></svg>Open .txt</button>
      <input type="file" id="file-input" accept=".txt,text/plain" hidden>
    </div>
  </section>

  <section class="sheet look-sheet" id="look-sheet" role="dialog" aria-modal="true" aria-labelledby="look-title" hidden>
    <div class="sheet-grab"><div class="sheet-grabber"></div></div>
    <header class="sheet-head">
      <h2 id="look-title">Text and voice</h2>
      <button class="bar-btn strong" type="button" data-close>Done</button>
    </header>
    <div class="sheet-body">
      <div class="look-row">
        <span class="row-label" id="theme-label">Theme</span>
        <div class="swatches" role="group" aria-labelledby="theme-label" id="theme-swatches">
          <button class="swatch-btn" type="button" data-theme-choice="auto" aria-pressed="false"><span class="swatch auto"></span><span class="swatch-label">Auto</span></button>
          <button class="swatch-btn" type="button" data-theme-choice="paper" aria-pressed="false"><span class="swatch" style="background:#FBF5E9;color:#2B2620">Aa</span><span class="swatch-label">Paper</span></button>
          <button class="swatch-btn" type="button" data-theme-choice="sky" aria-pressed="false"><span class="swatch" style="background:#EAF2F8;color:#1E2A35">Aa</span><span class="swatch-label">Sky</span></button>
          <button class="swatch-btn" type="button" data-theme-choice="dusk" aria-pressed="false"><span class="swatch" style="background:#1F2023;color:#E6E2DA">Aa</span><span class="swatch-label">Dark</span></button>
          <button class="swatch-btn" type="button" data-theme-choice="night" aria-pressed="false"><span class="swatch" style="background:#17140F;color:#D9CBB3">Aa</span><span class="swatch-label">Night</span></button>
        </div>
      </div>

      <div class="look-row">
        <span class="row-label" id="font-label">Font</span>
        <div class="seg" role="group" aria-labelledby="font-label" data-setting="font">
          <button type="button" data-value="dyslexic" aria-pressed="false">Dyslexic</button>
          <button type="button" data-value="standard" aria-pressed="false">Standard</button>
        </div>
      </div>

      <div class="look-row">
        <div class="row-head"><label class="row-label" for="size-range">Size</label><span class="row-value" id="size-value"></span></div>
        <div class="slider-row">
          <span class="a-small" aria-hidden="true">A</span>
          <input type="range" id="size-range" min="15" max="33" step="2">
          <span class="a-large" aria-hidden="true">A</span>
        </div>
      </div>

      <div class="look-row">
        <span class="row-label" id="spacing-label">Spacing</span>
        <div class="seg" role="group" aria-labelledby="spacing-label" data-setting="spacing">
          <button type="button" data-value="normal" aria-pressed="false">Normal</button>
          <button type="button" data-value="wide" aria-pressed="false">Wide</button>
        </div>
      </div>

      <div class="look-row">
        <button class="switch-row" type="button" role="switch" id="ruler-switch" aria-checked="false">
          <span class="switch-text"><span class="switch-title">Line focus</span></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
      </div>

      <div class="look-row">
        <label class="row-label" for="voice-select">Voice</label>
        <span class="select-wrap">
          <select id="voice-select"></select>
          <svg class="icon"><use href="#i-chevron-left"/></svg>
        </span>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
